<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Калькулятор капельниц</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #f4f6f9);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1d23);
    --hint: var(--tg-theme-hint-color, #8a919c);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(127,127,127,.18);
    --warn: #e5534b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-tg]){
      --bg:#14171c; --card:#1e2229; --text:#eef0f3; --hint:#8d95a1; --accent:#4c93f5;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
  h1{font-size:20px;margin:4px 0 14px;font-weight:700}
  .tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;margin-bottom:14px}
  .tab{flex:1;min-width:0;border:0;background:none;color:var(--hint);font:inherit;font-size:13px;font-weight:600;
    padding:10px 2px;border-radius:10px;cursor:pointer}
  .tab.on{background:var(--accent);color:var(--accent-text)}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--hint);margin:0 0 6px;font-weight:600}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .row{display:flex;gap:8px}
  .row > *{flex:1;min-width:0}
  input,select{width:100%;font:inherit;font-size:18px;color:var(--text);background:var(--bg);
    border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
  select{font-size:16px;background-image:linear-gradient(45deg,transparent 50%,var(--hint) 50%),linear-gradient(135deg,var(--hint) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
  input:focus,select:focus{border-color:var(--accent)}
  .unit{position:relative}
  .unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:14px;pointer-events:none}
  .unit input{padding-right:44px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px;
    padding:8px 12px;border-radius:20px;cursor:pointer}
  .chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-text)}
  .chip small{opacity:.75}
  #customK{margin-top:8px;display:none}
  .result{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:2px solid var(--accent)}
  .big{font-size:40px;font-weight:800;line-height:1.1}
  .big small{font-size:16px;font-weight:600;color:var(--hint)}
  .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .sub div{background:var(--bg);border-radius:12px;padding:10px}
  .sub b{display:block;font-size:18px}
  .sub span{font-size:12px;color:var(--hint)}
  .empty{color:var(--hint);font-size:15px}
  .err{color:var(--warn);font-size:15px;font-weight:600}
  .note{font-size:12px;color:var(--hint);text-align:center;margin-top:16px;line-height:1.5}
  .pane{display:none}.pane.on{display:block}
  .formula{font-size:12px;color:var(--hint);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>💧 Калькулятор капельниц</h1>

  <div class="tabs">
    <button class="tab on" data-p="rate">Капли/мин</button>
    <button class="tab" data-p="time">Время</button>
    <button class="tab" data-p="dose">По дозе</button>
    <button class="tab" data-p="drug">Препараты</button>
  </div>

  <!-- Капельная система — общая для всех режимов -->
  <div class="card">
    <label>Капельная система (капель в 1 мл)</label>
    <div class="chips" id="kChips">
      <button class="chip on" data-k="20">20 <small>стандарт</small></button>
      <button class="chip" data-k="15">15</button>
      <button class="chip" data-k="60">60 <small>микро</small></button>
      <button class="chip" data-k="custom">другая</button>
    </div>
    <div class="unit" id="customK"><input id="kVal" inputmode="decimal" placeholder="капель в 1 мл"><span>кап/мл</span></div>
  </div>

  <!-- Режим 1 -->
  <div class="pane on" id="p-rate">
    <div class="card">
      <div class="field">
        <label>Объём раствора</label>
        <div class="unit"><input id="r-v" inputmode="decimal" placeholder="например, 400"><span>мл</span></div>
      </div>
      <div class="field">
        <label>Время введения</label>
        <div class="row">
          <div class="unit"><input id="r-h" inputmode="decimal" placeholder="0"><span>ч</span></div>
          <div class="unit"><input id="r-m" inputmode="decimal" placeholder="0"><span>мин</span></div>
        </div>
      </div>
    </div>
    <div class="result" id="r-out"></div>
  </div>

  <!-- Режим 2 -->
  <div class="pane" id="p-time">
    <div class="card">
      <div class="field">
        <label>Объём раствора</label>
        <div class="unit"><input id="t-v" inputmode="decimal" placeholder="например, 500"><span>мл</span></div>
      </div>
      <div class="field">
        <label>Скорость</label>
        <div class="unit"><input id="t-d" inputmode="decimal" placeholder="например, 40"><span>кап/мин</span></div>
      </div>
    </div>
    <div class="result" id="t-out"></div>
  </div>

  <!-- Режим 3 -->
  <div class="pane" id="p-dose">
    <div class="card">
      <div class="field">
        <label>Препарата во флаконе / шприце</label>
        <div class="row">
          <input id="d-amt" inputmode="decimal" placeholder="количество">
          <select id="d-amtU"><option>мг</option><option>мкг</option><option>ЕД</option></select>
        </div>
      </div>
      <div class="field">
        <label>Разведён в общем объёме</label>
        <div class="unit"><input id="d-vol" inputmode="decimal" placeholder="например, 50"><span>мл</span></div>
      </div>
      <div class="field">
        <label>Назначенная доза</label>
        <div class="row">
          <input id="d-dose" inputmode="decimal" placeholder="доза">
          <select id="d-doseU">
            <option value="мг|ч|0">мг/ч</option>
            <option value="мг|мин|0">мг/мин</option>
            <option value="мкг|мин|0">мкг/мин</option>
            <option value="мкг|ч|0">мкг/ч</option>
            <option value="мкг|мин|1">мкг/кг/мин</option>
            <option value="мг|ч|1">мг/кг/ч</option>
            <option value="мг|мин|1">мг/кг/мин</option>
            <option value="ЕД|ч|0">ЕД/ч</option>
            <option value="ЕД|ч|1">ЕД/кг/ч</option>
          </select>
        </div>
      </div>
      <div class="field" id="d-wF" style="display:none">
        <label>Вес пациента</label>
        <div class="unit"><input id="d-w" inputmode="decimal" placeholder="например, 70"><span>кг</span></div>
      </div>
    </div>
    <div class="result" id="d-out"></div>
  </div>


  <!-- Режим 4: препараты -->
  <div class="pane" id="p-drug">
    <div class="card">
      <div class="field">
        <label>Препарат</label>
        <select id="g-drug"></select>
        <div id="g-info" style="margin-top:8px;font-size:13px;line-height:1.45;background:var(--bg);border-radius:12px;padding:10px 12px"></div>
      </div>
      <div class="field">
        <label>Форма выпуска</label>
        <div class="chips" id="g-forms"></div>
      </div>
      <div class="field">
        <label>В 1 ампуле / флаконе <span style="font-weight:400">(сверьте с упаковкой)</span></label>
        <div class="row">
          <div class="unit"><input id="g-ad" inputmode="decimal"><span id="g-au">мг</span></div>
          <div class="unit"><input id="g-aml" inputmode="decimal"><span>мл</span></div>
        </div>
      </div>
      <div class="field">
        <label>Сколько ампул</label>
        <div class="unit"><input id="g-n" inputmode="decimal" value="1"><span>шт</span></div>
      </div>
      <div class="field">
        <label>Растворитель (NaCl 0,9% и т.п.)</label>
        <div class="chips" id="g-sol">
          <button class="chip" data-v="0">без</button>
          <button class="chip" data-v="100">100</button>
          <button class="chip on" data-v="200">200</button>
          <button class="chip" data-v="250">250</button>
          <button class="chip" data-v="400">400</button>
        </div>
        <div class="unit" style="margin-top:8px"><input id="g-sv" inputmode="decimal" value="200"><span>мл</span></div>
      </div>
      <div class="field">
        <label>Время введения <span style="font-weight:400">(можно оставить пустым, если в инструкции дана скорость)</span></label>
        <div class="row">
          <div class="unit"><input id="g-h" inputmode="decimal" placeholder="0"><span>ч</span></div>
          <div class="unit"><input id="g-m" inputmode="decimal" placeholder="0"><span>мин</span></div>
        </div>
      </div>
    </div>
    <div class="result" id="g-out"></div>
  </div>
  <div class="note">Калькулятор только считает. Назначение и дозу определяет врач —<br>перед введением сверяйте результат.</div>
</div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData !== undefined) {
    try { tg.ready(); tg.expand(); document.documentElement.setAttribute('data-tg',''); } catch(e){}
  }

  function $(id){ return document.getElementById(id); }
  function num(id){
    var s = ($(id).value || '').replace(',', '.').trim();
    if (s === '') return NaN;
    var n = parseFloat(s);
    return isFinite(n) ? n : NaN;
  }
  function fmt(n, d){
    if (!isFinite(n)) return '—';
    var r = Number(n.toFixed(d === undefined ? 1 : d));
    return r.toLocaleString('ru-RU', {maximumFractionDigits: d === undefined ? 1 : d});
  }
  function hm(min){
    var total = Math.round(min);
    var h = Math.floor(total/60), m = total % 60;
    if (h === 0) return m + ' мин';
    return h + ' ч' + (m ? ' ' + m + ' мин' : '');
  }

  // ---- капельная система
  var k = 20;
  function store(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }
  function load(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }

  function setK(val){
    document.querySelectorAll('#kChips .chip').forEach(function(c){ c.classList.toggle('on', c.dataset.k === val); });
    $('customK').style.display = val === 'custom' ? 'block' : 'none';
    k = val === 'custom' ? num('kVal') : parseFloat(val);
    store('kSel', val);
    calc();
  }
  document.querySelectorAll('#kChips .chip').forEach(function(c){
    c.addEventListener('click', function(){ setK(c.dataset.k); });
  });
  $('kVal').addEventListener('input', function(){ k = num('kVal'); store('kCustom', $('kVal').value); calc(); });

  // ---- вкладки
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === t); });
      document.querySelectorAll('.pane').forEach(function(p){ p.classList.toggle('on', p.id === 'p-' + t.dataset.p); });
      if (tg && tg.HapticFeedback) try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
    });
  });

  var EMPTY = '<div class="empty">Введите данные — результат появится здесь</div>';
  function kBad(){ return !(k > 0); }

  function ratePanel(dpm, mlh){
    return '<div class="big">' + fmt(Math.round(dpm),0) + ' <small>кап/мин</small></div>' +
      '<div class="sub">' +
        '<div><b>' + fmt(dpm/4, 1) + '</b><span>капель за 15 сек</span></div>' +
        '<div><b>' + fmt(60/dpm, 1) + ' сек</b><span>между каплями</span></div>' +
        '<div><b>' + fmt(mlh, 1) + '</b><span>мл/ч (для инфузомата)</span></div>' +
        '<div><b>' + fmt(dpm, 1) + '</b><span>кап/мин точно</span></div>' +
      '</div>';
  }

  function calcRate(){
    var v = num('r-v'), h = num('r-h'), m = num('r-m');
    var t = (isNaN(h)?0:h)*60 + (isNaN(m)?0:m);
    var out = $('r-out');
    if (!(v > 0) || !(t > 0)) { out.innerHTML = EMPTY; return; }
    if (kBad()) { out.innerHTML = '<div class="err">Укажите капельную систему</div>'; return; }
    var dpm = v * k / t;
    out.innerHTML = ratePanel(dpm, v / t * 60) +
      '<div class="formula">' + fmt(v,1) + ' мл × ' + fmt(k,0) + ' кап/мл ÷ ' + fmt(t,0) + ' мин</div>';
  }

  function calcTime(){
    var v = num('t-v'), d = num('t-d');
    var out = $('t-out');
    if (!(v > 0) || !(d > 0)) { out.innerHTML = EMPTY; return; }
    if (kBad()) { out.innerHTML = '<div class="err">Укажите капельную систему</div>'; return; }
    var min = v * k / d;
    var end = new Date(Date.now() + min*60000);
    var endStr = ('0'+end.getHours()).slice(-2) + ':' + ('0'+end.getMinutes()).slice(-2);
    out.innerHTML = '<div class="big">' + hm(min) + '</div>' +
      '<div class="sub">' +
        '<div><b>' + endStr + '</b><span>закончится, если начать сейчас</span></div>' +
        '<div><b>' + fmt(d / k * 60, 1) + '</b><span>мл/ч</span></div>' +
      '</div>';
  }

  function calcDose(){
    var parts = $('d-doseU').value.split('|');
    var dU = parts[0], per = parts[1], perKg = parts[2] === '1';
    $('d-wF').style.display = perKg ? 'block' : 'none';

    var amt = num('d-amt'), aU = $('d-amtU').value, vol = num('d-vol'), dose = num('d-dose'), w = num('d-w');
    var out = $('d-out');
    if (!(amt > 0) || !(vol > 0) || !(dose > 0) || (perKg && !(w > 0))) { out.innerHTML = EMPTY; return; }
    if ((aU === 'ЕД') !== (dU === 'ЕД')) {
      out.innerHTML = '<div class="err">Единицы не совпадают: препарат в ' + aU + ', а доза в ' + dU + '</div>'; return;
    }
    // всё приводим к мг (или ЕД)
    function toBase(x,u){ return u === 'мкг' ? x/1000 : x; }
    var conc = toBase(amt, aU) / vol;                 // мг (ЕД) в 1 мл
    var perHour = toBase(dose, dU) * (perKg ? w : 1) * (per === 'мин' ? 60 : 1); // мг (ЕД) в час
    var mlh = perHour / conc;
    var baseU = aU === 'ЕД' ? 'ЕД' : 'мг';
    var html = '<div class="big">' + fmt(mlh, 2) + ' <small>мл/ч</small></div>' +
      '<div class="sub">' +
        '<div><b>' + fmt(conc < 0.1 && baseU==='мг' ? conc*1000 : conc, 3) + '</b><span>' + (conc < 0.1 && baseU==='мг' ? 'мкг' : baseU) + ' в 1 мл</span></div>' +
        '<div><b>' + fmt(perHour, 3) + '</b><span>' + baseU + ' в час</span></div>';
    if (!kBad()) {
      var dpm = mlh * k / 60;
      html += '<div><b>' + fmt(Math.round(dpm),0) + '</b><span>кап/мин (система ' + fmt(k,0) + ')</span></div>' +
              '<div><b>' + hm(vol / mlh * 60) + '</b><span>хватит всего объёма</span></div>';
    }
    html += '</div>';
    out.innerHTML = html;
  }


  // ---- препараты
  var DRUGS = [
    {n:'Мексидол', f:[{t:'50 мг/мл, 2 мл',d:100,u:'мг',ml:2},{t:'50 мг/мл, 5 мл',d:250,u:'мг',ml:5}],
     sol:100, info:'Капельно: развести в 100–150 мл NaCl 0,9% или глюкозы 5%. Струйно — медленно, не менее 5 мин. Макс. 1200 мг/сут. Скорость капель в инструкции не указана.'},
    {n:'Гептрал', f:[{t:'фл. 400 мг + 5 мл растворителя',d:400,u:'мг',ml:5}],
     sol:250, tmin:60, tmax:120, tdef:90, info:'Развести в 250 мл NaCl 0,9% или глюкозы 5%, вводить медленно в течение 1–2 ч. Не смешивать со щелочными растворами и растворами с кальцием.'},
    {n:'Аспаркам', f:[{t:'амп. 10 мл',d:10,u:'мл',ml:10},{t:'амп. 5 мл',d:5,u:'мл',ml:5}],
     sol:200, rate:[20,25], info:'10–20 мл препарата развести в 100–200 мл NaCl 0,9% или глюкозы 5%. Скорость 20–25 кап/мин.'},
    {n:'L-лизина эсцинат', f:[{t:'1 мг/мл, 5 мл',d:5,u:'мг',ml:5}],
     sol:100, info:'Строго в/в, капельно: развести в 50–100 мл NaCl 0,9%. Без разведения не применять. Обычно 5–10 мл/сут. Скорость в инструкции не указана.'},
    {n:'Цераксон', f:[{t:'500 мг / 4 мл',d:500,u:'мг',ml:4},{t:'1000 мг / 4 мл',d:1000,u:'мг',ml:4}],
     sol:100, rate:[40,60], info:'Капельно со скоростью 40–60 кап/мин. Совместим с изотоническими растворами и растворами декстрозы. Объём разведения в инструкции не указан — по назначению.'},
    {n:'Дексаметазон', f:[{t:'4 мг / 1 мл',d:4,u:'мг',ml:1},{t:'8 мг / 2 мл',d:8,u:'мг',ml:2}],
     sol:100, info:'Капельно — в NaCl 0,9% или глюкозе 5%. Объём и скорость в инструкции не указаны — по назначению. С другими препаратами не смешивать (с гепарином — осадок).'},
    {n:'Тиоктовая кислота (Берлитион)', f:[{t:'300 ЕД (300 мг) / 12 мл',d:300,u:'мг',ml:12},{t:'600 ЕД (600 мг) / 24 мл',d:600,u:'мг',ml:24}],
     sol:250, tmin:30, tdef:30, info:'1–2 ампулы развести в 250 мл ТОЛЬКО NaCl 0,9% (не глюкоза, не Рингер). Вводить не быстрее чем за 30 мин. Готовить перед введением и защищать флакон от света (фольгой).'},
    {n:'Магния сульфат 25%', f:[{t:'амп. 5 мл (1250 мг)',d:1250,u:'мг',ml:5},{t:'амп. 10 мл (2500 мг)',d:2500,u:'мг',ml:10}],
     sol:100, info:'Дозы и скорость зависят от показания (напр. при преэклампсии 1–2 г/ч), назначает врач. Для расчёта в мл/ч можно использовать вкладку «По дозе».'},
    {n:'Эуфиллин 2,4%', f:[{t:'амп. 10 мл (240 мг)',d:240,u:'мг',ml:10},{t:'амп. 5 мл (120 мг)',d:120,u:'мг',ml:5}],
     sol:150, rate:[30,50], info:'Капельно: 10–20 мл развести в 100–150 мл NaCl 0,9%, скорость 30–50 кап/мин. Подогреть до температуры тела. Не смешивать с глюкозой. Макс. разовая доза 250 мг.'},
    {n:'Вессел Дуэ Ф', f:[{t:'600 ЛЕ / 2 мл',d:600,u:'ЛЕ',ml:2}],
     sol:100, info:'По инструкции: 1 ампула в день в/м или в/в, 15–20 дней. Объём и скорость капельного введения в инструкции не указаны — по назначению врача.'}
  ];
  var gUnit = 'мг', gDrug = DRUGS[0];
  DRUGS.forEach(function(d,i){ var o=document.createElement('option'); o.value=i; o.textContent=d.n; $('g-drug').appendChild(o); });
  function setForm(f, btn){
    document.querySelectorAll('#g-forms .chip').forEach(function(c){ c.classList.toggle('on', c===btn); });
    $('g-ad').value = f.d; $('g-aml').value = f.ml; gUnit = f.u; $('g-au').textContent = f.u;
    calcDrug();
  }
  function setSol(v){
    $('g-sv').value = v;
    document.querySelectorAll('#g-sol .chip').forEach(function(x){ x.classList.toggle('on', x.dataset.v == String(v)); });
  }
  function setDrug(i){
    gDrug = DRUGS[i];
    $('g-info').textContent = gDrug.info;
    setSol(gDrug.sol);
    $('g-h').value = ''; $('g-m').value = gDrug.tdef ? String(gDrug.tdef) : '';
    var box = $('g-forms'); box.innerHTML = '';
    gDrug.f.forEach(function(f,j){
      var b=document.createElement('button'); b.className='chip'; b.textContent=f.t;
      b.addEventListener('click', function(){ setForm(f,b); });
      box.appendChild(b); if(j===0) setForm(f,b);
    });
  }
  $('g-drug').addEventListener('change', function(){ setDrug(+this.value); });
  document.querySelectorAll('#g-sol .chip').forEach(function(c){
    c.addEventListener('click', function(){ setSol(c.dataset.v); calcDrug(); });
  });
  function warn(t){ return '<div class="err" style="margin-top:10px">⚠️ ' + t + '</div>'; }
  function calcDrug(){
    var out=$('g-out');
    var ad=num('g-ad'), aml=num('g-aml'), n=num('g-n'), sv=num('g-sv'), h=num('g-h'), m=num('g-m');
    var t=(isNaN(h)?0:h)*60+(isNaN(m)?0:m);
    if(!(n>0) || isNaN(aml) || aml<0){ out.innerHTML=EMPTY; return; }
    var total = n*aml + (sv>0?sv:0);
    var dose = ad>0 ? ad*n : NaN;
    var name = $('g-drug').options[$('g-drug').selectedIndex].text;
    var head = '<div class="formula" style="margin:0 0 8px">' + name + ': ' + fmt(n,1) + ' амп.' + (isFinite(dose)&&gUnit!=='мл' ? ' = <b>' + fmt(dose,1) + ' ' + gUnit + '</b>' : '') + ' в ' + fmt(total,1) + ' мл</div>';
    if(!(total>0)){ out.innerHTML = EMPTY; return; }
    if(kBad()){ out.innerHTML = head + '<div class="err">Укажите капельную систему</div>'; return; }
    var r = gDrug.rate;
    if(!(t>0)){
      if(r){
        var tLong = total*k/r[0], tShort = total*k/r[1];
        out.innerHTML = head +
          '<div class="big">' + r[0] + '–' + r[1] + ' <small>кап/мин по инструкции</small></div>' +
          '<div class="sub">' +
            '<div><b>' + hm(tShort) + ' – ' + hm(tLong) + '</b><span>займёт капельница</span></div>' +
            '<div><b>' + fmt(r[0]/4,0) + '–' + fmt(r[1]/4,0) + '</b><span>капель за 15 сек</span></div>' +
            '<div><b>' + fmt(r[0]/k*60,0) + '–' + fmt(r[1]/k*60,0) + '</b><span>мл/ч (для инфузомата)</span></div>' +
          '</div>';
      } else {
        out.innerHTML = head + '<div class="empty">Укажите время введения по назначению</div>';
      }
      return;
    }
    var dpm = total*k/t;
    var html = head + ratePanel(dpm, total/t*60) +
      '<div class="formula">' + fmt(total,1) + ' мл × ' + fmt(k,0) + ' кап/мл ÷ ' + fmt(t,0) + ' мин</div>';
    if(r && (dpm < r[0]-0.5 || dpm > r[1]+0.5)) html += warn('По инструкции ' + r[0] + '–' + r[1] + ' кап/мин');
    if(gDrug.tmin && t < gDrug.tmin) html += warn('По инструкции вводить не быстрее чем за ' + hm(gDrug.tmin));
    if(gDrug.tmax && t > gDrug.tmax) html += warn('По инструкции — в течение ' + hm(gDrug.tmin) + '–' + hm(gDrug.tmax));
    out.innerHTML = html;
  }
  setDrug(0);

  function calc(){ calcRate(); calcTime(); calcDose(); calcDrug(); }

  document.querySelectorAll('input:not(#kVal), select').forEach(function(el){
    el.addEventListener('input', calc);
    el.addEventListener('change', calc);
  });

  // восстановить выбор системы
  var saved = load('kSel'), savedC = load('kCustom');
  if (savedC) $('kVal').value = savedC;
  setK(saved || '20');
})();
</script>
</body>
</html>
